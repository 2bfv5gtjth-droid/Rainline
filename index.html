<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainline</title>
<meta name="theme-color" content="#1D3FD6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rainline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F2; --surface:#F7FAFB; --ink:#10242C; --muted:#586E77; --line:#C9D6DB;
  --rain:#1D3FD6; --warm:#C9721F; --wind:#0E7C7B; --field:#FFFFFF;
  --sun:#E99A0C; --cloud:#93A9B3; --snow:#7FA8DD; --moon:#D9A82E; --sky:transparent;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C171C; --surface:#13232A; --ink:#E4EEF1; --muted:#8CA3AC; --line:#25404A;
    --rain:#7C9BFF; --warm:#F0A552; --wind:#5FD3C8; --field:#0C171C;
    --sun:#F6C453; --cloud:#7C929C; --snow:#9CC0F0; --moon:#F3DC8A;
  }
}
:root[data-theme="dark"]{
  --bg:#0C171C; --surface:#13232A; --ink:#E4EEF1; --muted:#8CA3AC; --line:#25404A;
  --rain:#7C9BFF; --warm:#F0A552; --wind:#5FD3C8; --field:#0C171C;
  --sun:#F6C453; --cloud:#7C929C; --snow:#9CC0F0; --moon:#F3DC8A;
}
:root[data-sky="sun"]{--sky:rgba(245,176,40,.30)}
:root[data-sky="partly"]{--sky:rgba(200,190,150,.28)}
:root[data-sky="cloud"]{--sky:rgba(130,150,160,.26)}
:root[data-sky="fog"]{--sky:rgba(140,150,155,.26)}
:root[data-sky="rain"]{--sky:rgba(50,90,220,.24)}
:root[data-sky="storm"]{--sky:rgba(90,70,170,.30)}
:root[data-sky="snow"]{--sky:rgba(150,190,235,.34)}
:root[data-sky="moon"],:root[data-sky="moonpartly"]{--sky:rgba(60,70,170,.30)}
html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; overflow:hidden; color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0,rgba(0,0,0,0) 420px) no-repeat, var(--bg);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45; -webkit-font-smoothing:antialiased;
}
a{color:var(--rain)}
button{
  font:inherit; cursor:pointer; border-radius:999px; border:1px solid var(--line);
  background:transparent; color:var(--ink); padding:10px 16px;
}
:focus-visible{outline:3px solid var(--rain); outline-offset:2px}
.app{
  display:flex; flex-direction:column;
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
}
.wrap{max-width:640px; margin:0 auto; width:100%}

/* header + tabs */
.bar{flex:none; padding:10px 18px 0}
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.place{
  display:flex; align-items:center; gap:8px; margin:0;
  font-size:clamp(1.35rem,5.6vw,1.8rem); font-weight:800; letter-spacing:-.02em; line-height:1.15;
}
.place svg{flex:none; color:var(--rain)}
.date{color:var(--muted); font-size:.9rem; margin:1px 0 0}
.status{color:var(--muted); font-size:.85rem; margin:2px 0 0}
.status:empty{display:none}
.acts{display:flex; gap:2px; flex:none}
.iconbtn{border:0; padding:8px; line-height:0; border-radius:50%}
.iconbtn svg{width:22px; height:22px}
.iconbtn:disabled{opacity:.35; cursor:default}
.star svg path{fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linejoin:round}
.star[aria-pressed="true"] svg path{fill:var(--sun); stroke:var(--sun)}
.iconbtn svg.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.iconbtn svg.spin{animation:none}}
.tabs{
  position:relative; display:flex; overflow-x:auto; margin:8px -18px 0; padding:0 8px;
  border-bottom:1px solid var(--line); scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto; border:0; border-radius:0; background:none; white-space:nowrap;
  padding:11px 12px; color:var(--muted); font-weight:600; font-size:.95rem;
}
.tab[aria-selected="true"]{color:var(--ink)}
.ind{position:absolute; bottom:0; left:0; height:3px; width:0; border-radius:3px; background:var(--rain); pointer-events:none}

/* alert banner */
.banner{
  flex:none; display:flex; align-items:center; gap:10px; margin:8px auto 0;
  width:calc(100% - 36px); max-width:604px; padding:10px 14px; border-radius:14px;
  background:var(--ink); color:var(--bg);
}
.banner span{flex:1; cursor:pointer}
.banner b{font-weight:800}
.banner button{flex:none; border:0; padding:2px 8px; color:var(--bg); font-size:1.3rem; line-height:1}

/* swipeable panes */
.pager{
  flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.pager::-webkit-scrollbar{display:none}
.pane{
  flex:0 0 100%; min-width:0; scroll-snap-align:start; scroll-snap-stop:always;
  overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch;
}
.in{max-width:640px; margin:0 auto; padding:16px 18px 36px}
body.rtl .pane, body.rtl .top, body.rtl .banner{direction:rtl}
body.rtl #chart, body.rtl .strip{direction:ltr}

/* today */
.hero{display:flex; align-items:center; gap:18px; margin:6px 0 4px}
.htemp{font-size:clamp(3.4rem,15vw,4.6rem); font-weight:800; letter-spacing:-.05em; line-height:1}
.htemp .u{font-size:.4em; font-weight:600; letter-spacing:0; vertical-align:top; margin-inline-start:2px; color:var(--muted)}
.hlabel{font-size:1.15rem; font-weight:600}
.tip{color:var(--muted); margin:6px 0 0}
.tip:empty{display:none}
.summary{
  font-size:clamp(1.35rem,5.6vw,1.9rem); line-height:1.15; font-weight:800;
  letter-spacing:-.02em; margin:22px 0 6px; max-width:20em;
}
.sub{color:var(--muted); margin:0 0 20px}
.stats{display:flex; margin:0 0 22px; padding:0}
.stats div{flex:1; padding:0 14px; border-inline-start:1px solid var(--line)}
.stats div:first-child{padding-inline-start:0; border-inline-start:0}
.stats dt{color:var(--muted); font-size:.85rem}
.stats dd{margin:0; font-size:1.25rem; font-weight:800; letter-spacing:-.01em}
.dry{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.dry span{color:var(--muted)}
.dry b{font-weight:800; text-align:end}
.sec{font-size:1.05rem; margin:26px 0 8px; letter-spacing:-.01em}
.strip{
  display:flex; gap:6px; overflow-x:auto; overscroll-behavior-x:contain;
  margin:0 -18px; padding:2px 18px 8px; scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.hr{
  flex:0 0 60px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0;
  border-radius:14px; background:var(--surface); border:1px solid var(--line);
}
.hr .h{font-size:.78rem; color:var(--muted)}
.hr .tp{font-weight:700}
.hr .pp{font-size:.75rem; color:var(--rain); min-height:1.1em}
.details{display:grid; grid-template-columns:1fr 1fr; column-gap:24px; margin:0}
.details div{padding:12px 0; border-bottom:1px solid var(--line)}
.details dt{color:var(--muted); font-size:.85rem}
.details dd{margin:0; font-size:1.1rem; font-weight:700}

/* charts */
.seg{display:inline-flex; flex-wrap:wrap; gap:6px}
.seg button{padding:8px 14px; font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg); font-weight:600}
.modes{margin-bottom:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 12px 12px}
.readout{padding:0 8px 6px; min-height:3.7rem}
.readout .big{font-size:1.75rem; font-weight:800; letter-spacing:-.02em; line-height:1.15}
.readout .small{color:var(--muted); font-size:.95rem}
#chart{display:block; width:100%; height:auto; touch-action:pan-y; cursor:crosshair}
.grid{stroke:var(--line); stroke-width:1}
.axis{fill:var(--muted); font-size:12px; font-family:inherit}
.axis.mid{font-size:15px}
.bar1{fill:var(--rain); opacity:.28}
.nbar{fill:var(--rain); opacity:.55}
.nbar.on{opacity:1}
.line{fill:none; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round}
.line.rain{stroke:var(--rain)} .line.temp{stroke:var(--warm)} .line.wind{stroke:var(--wind)}
.line.feels{stroke:var(--warm); stroke-width:2.5; stroke-dasharray:1 7}
.guide{stroke:var(--ink); stroke-width:1; stroke-dasharray:3 4; opacity:.6}
.dot{stroke:var(--surface); stroke-width:3}
.dot.rain{fill:var(--rain)} .dot.temp{fill:var(--warm)} .dot.wind{fill:var(--wind)}
.legend{color:var(--muted); font-size:.85rem; padding:6px 8px 0; margin:0}

/* icons */
.wi{display:block; flex:none}
.wi .s circle{fill:var(--sun)}
.wi .s line{stroke:var(--sun); stroke-width:3; stroke-linecap:round}
.wi .c{fill:var(--cloud)}
.wi .d{stroke:var(--rain); stroke-width:3; stroke-linecap:round}
.wi .n{fill:var(--snow)}
.wi .b{fill:var(--sun)}
.wi .f{stroke:var(--cloud); stroke-width:3; stroke-linecap:round}
.wi .m{fill:var(--moon)}

/* week */
h2{font-size:1.2rem; margin:6px 0 4px; letter-spacing:-.01em}
.days{list-style:none; margin:0; padding:0}
.days li{
  display:grid; grid-template-columns:40px minmax(0,1fr) 64px 72px; align-items:center; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--line);
}
.dn{display:flex; flex-direction:column; line-height:1.25}
.dn b{font-weight:600}
.dn small{color:var(--muted); font-size:.85rem}
.dr{display:flex; flex-direction:column; gap:5px}
.dr .p{color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums}
.track{display:block; height:6px; border-radius:999px; background:var(--line); overflow:hidden}
.fill{display:block; height:100%; background:var(--rain); border-radius:999px}
.days .t{text-align:end; font-variant-numeric:tabular-nums; font-weight:600}
.days .t span{color:var(--muted); font-weight:400}

/* places */
.search{display:flex; gap:8px; margin:6px 0 8px}
input,select{
  font:inherit; color:var(--ink); background:var(--field); border:1px solid var(--line);
}
.search input{flex:1; min-width:0; border-radius:999px; padding:10px 16px}
.search button{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
.ghost{padding:8px 14px; font-size:.92rem}
.plist{list-style:none; margin:0; padding:0}
.plist li{display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--line)}
.plist .pn{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; text-align:start;
  border:0; border-radius:0; padding:14px 0; font-weight:600; background:none;
}
.plist .pn small{color:var(--rain); font-weight:400; font-size:.8rem}
.plist .x{border:0; padding:6px 12px; font-size:1.4rem; line-height:1; color:var(--muted)}
.plist .empty{color:var(--muted); padding:14px 0}

/* settings */
.srow{padding:12px 0; border-bottom:1px solid var(--line)}
.srow.inline{display:flex; align-items:center; justify-content:space-between; gap:14px}
.sl{display:block; margin-bottom:8px; font-weight:600}
.srow.inline .sl{margin:0}
.srow select{width:100%; border-radius:12px; padding:11px 12px}
.snote{color:var(--muted); font-size:.85rem; margin:6px 0 0}
.sw{
  flex:none; display:flex; width:50px; height:30px; padding:3px; border-radius:999px;
  background:var(--line); border:0; justify-content:flex-start; align-items:center;
}
.sw i{display:block; width:24px; height:24px; border-radius:50%; background:#fff}
.sw[aria-checked="true"]{background:var(--rain); justify-content:flex-end}
.sbtn{margin:14px 10px 0 0}
.about{color:var(--muted); font-size:.85rem; margin:20px 0 0}
.topic{
  display:block; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--field);
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem; word-break:break-all;
  -webkit-user-select:all; user-select:all; direction:ltr; text-align:left;
}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><div class="wrap">
    <div class="top">
      <div>
        <h1 class="place">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span id="place"></span>
        </h1>
        <p class="date" id="date"></p>
        <p class="status" id="status" role="status"></p>
      </div>
      <div class="acts">
        <button class="iconbtn star" id="star" type="button" aria-pressed="false" data-i18n-aria="save_place">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z"/></svg>
        </button>
        <button class="iconbtn" id="refresh" type="button" data-i18n-aria="refresh">
          <svg id="refreshIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="0" data-i18n="tab_today"></button>
      <button class="tab" type="button" role="tab" data-tab="1" data-i18n="tab_charts"></button>
      <button class="tab" type="button" role="tab" data-tab="2" data-i18n="tab_week"></button>
      <button class="tab" type="button" role="tab" data-tab="3" data-i18n="tab_places"></button>
      <button class="tab" type="button" role="tab" data-tab="4" data-i18n="tab_settings"></button>
      <span class="ind" id="ind"></span>
    </nav>
  </div></header>

  <div class="banner" id="banner" hidden>
    <span id="bannerText"></span>
    <button type="button" id="bannerClose" data-i18n-aria="banner_close">×</button>
  </div>

  <main class="pager" id="pager">
    <section class="pane" id="pane0" role="tabpanel"><div class="in">
      <div class="hero">
        <div id="hicon"></div>
        <div><div class="htemp" id="htemp"></div><div class="hlabel" id="hlabel"></div></div>
      </div>
      <p class="tip" id="tip"></p>
      <h2 class="summary" id="summary"></h2>
      <p class="sub" id="sub"></p>
      <dl class="stats">
        <div><dt data-i18n="lb_feels"></dt><dd id="sFeels"></dd></div>
        <div><dt data-i18n="lb_wind"></dt><dd id="sWind"></dd></div>
        <div><dt data-i18n="lb_rain24"></dt><dd id="sRain"></dd></div>
      </dl>
      <div class="dry" id="dry"></div>
      <h3 class="sec" data-i18n="hourly_title"></h3>
      <div class="strip" id="strip"></div>
      <h3 class="sec" data-i18n="details_title"></h3>
      <dl class="details" id="details"></dl>
    </div></section>

    <section class="pane" id="pane1" role="tabpanel"><div class="in">
      <div class="seg modes" id="modes" role="group">
        <button type="button" data-mode="rain" aria-pressed="true" data-i18n="m_rain"></button>
        <button type="button" data-mode="now" aria-pressed="false" data-i18n="m_now"></button>
        <button type="button" data-mode="temp" aria-pressed="false" data-i18n="m_temp"></button>
        <button type="button" data-mode="wind" aria-pressed="false" data-i18n="m_wind"></button>
      </div>
      <div class="card">
        <div class="readout" id="readout" aria-live="polite"></div>
        <svg id="chart" viewBox="0 0 640 300" role="img" aria-label="Forecast chart"></svg>
        <p class="legend" id="legend"></p>
      </div>
    </div></section>

    <section class="pane" id="pane2" role="tabpanel"><div class="in">
      <h2 data-i18n="wk_title"></h2>
      <ul class="days" id="days"></ul>
    </div></section>

    <section class="pane" id="pane3" role="tabpanel"><div class="in">
      <div class="search">
        <input id="city" type="text" data-i18n-ph="pl_search" aria-label="Search" autocomplete="off">
        <button id="go" type="button" data-i18n="pl_btn"></button>
      </div>
      <button class="ghost" id="locate" type="button" data-i18n="pl_loc"></button>
      <div id="results"></div>
      <h3 class="sec" data-i18n="pl_saved"></h3>
      <ul class="plist" id="plist"></ul>
    </div></section>

    <section class="pane" id="pane4" role="tabpanel"><div class="in">
      <h2 data-i18n="se_title"></h2>
      <div id="settings"></div>
    </div></section>
  </main>
</div>

var LANGS=[['en','English'],['nl','Nederlands'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português'],['it','Italiano'],['tr','Türkçe'],['ar','العربية'],['zh','中文']];

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function pad(n){return (n<10?'0':'')+n;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

function t(k,v){
  var s=(I18N[cfg.lang]&&I18N[cfg.lang][k])||I18N.en[k]||k;
  if(v){for(var x in v){s=s.split('{'+x+'}').join(v[x]);}}
  return s;
}
function LOCX(){return (LOCS[cfg.lang]||'en')+'-u-nu-latn';}
function nfmt(x,minD,maxD){
  try{return new Intl.NumberFormat(LOCX(),{minimumFractionDigits:minD,maximumFractionDigits:maxD}).format(x);}
  catch(e){return (+x).toFixed(maxD);}
}
function dateStr(d,opts){
  try{return d.toLocaleDateString(LOCX(),opts);}catch(e){return d.toDateString();}
}
function dur(m){
  return m<60?m+' '+t('d_min'):Math.floor(m/60)+' '+t('d_h')+(m%60?' '+(m%60)+' '+t('d_min'):'');
}
function h12(h){return (h%12)||12;}
function fmtH(d){var h=d.getHours();return cfg.time==='12'?h12(h)+' '+(h<12?'AM':'PM'):pad(h)+':00';}
function fmtT(d){var h=d.getHours();return cfg.time==='12'?h12(h)+':'+pad(d.getMinutes())+' '+(h<12?'AM':'PM'):pad(h)+':'+pad(d.getMinutes());}
function fmtAx(d){var h=d.getHours();return cfg.time==='12'?h12(h)+(h<12?'a':'p'):pad(h);}

/* units: data is stored metric, converted only for display */
function tmp(c){return cfg.temp==='f'?c*9/5+32:c;}
function tU(){return cfg.temp==='f'?'°F':'°C';}
function spd(k){var w=cfg.wind;return w==='mph'?k*0.621371:w==='ms'?k/3.6:w==='kn'?k*0.539957:k;}
function sU(){return {kmh:'km/h',mph:'mph',ms:'m/s',kn:'kn'}[cfg.wind]||'km/h';}
function aU(){return cfg.rain==='in'?'in':'mm';}
function fmtAmt(mm){return cfg.rain==='in'?nfmt(mm/25.4,2,2):nfmt(Math.round(mm*10)/10,0,1);}

/* ---------- settings storage ---------- */
function detectLang(){
  var n=((typeof navigator!=='undefined'&&navigator.language)||'en').slice(0,2).toLowerCase();
  return I18N[n]?n:'en';
}
function loadCfg(){
  var s={};
  try{s=JSON.parse(lsGet('rl_set')||'{}')||{};}catch(e){}
  var o={},k;
  for(k in DEF){o[k]=(k in s)?s[k]:DEF[k];}
  if(!I18N[o.lang])o.lang=detectLang();
  if(lsGet('rl_set')===null&&lsGet('rl_units')==='imperial'){o.temp='f';o.wind='mph';o.rain='in';}
  cfg=o;
}
function saveCfg(){lsSet('rl_set',JSON.stringify(cfg));}

/* ---------- weather icons ---------- */
function baseInfo(c){
  if(c===0)return {kind:'sun',label:'w_sunny'};
  if(c===1)return {kind:'sun',label:'w_mostlysunny'};
  if(c===2)return {kind:'partly',label:'w_partly'};
  if(c===3)return {kind:'cloud',label:'w_cloudy'};
  if(c===45||c===48)return {kind:'fog',label:'w_fog'};
  if(c>=51&&c<=57)return {kind:'rain',label:'w_drizzle'};
  if(c>=61&&c<=67)return {kind:'rain',label:'w_rain'};
  if((c>=71&&c<=77)||c===85||c===86)return {kind:'snow',label:'w_snow'};
  if(c>=80&&c<=82)return {kind:'rain',label:'w_showers'};
  if(c>=95)return {kind:'storm',label:'w_storm'};
  return {kind:'cloud',label:'w_cloudy'};
}
function codeInfo(c,day){
  var i=baseInfo(c);
  if(day===false){
    if(i.kind==='sun')return {kind:'moon',label:c===0?'w_clear':'w_mostlyclear'};
    if(i.kind==='partly')return {kind:'moonpartly',label:'w_partly'};
  }
  return i;
}
function icon(kind,size){
  function cloud(dy){
    return '<g class="c" transform="translate(0,'+dy+')"><circle cx="15" cy="27" r="7"/><circle cx="25" cy="21" r="9"/><circle cx="34" cy="28" r="6"/><rect x="15" y="27" width="19" height="7"/></g>';
  }
  function sun(cx,cy,r,ray){
    var g='<g class="s"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>';
    for(var k=0;k<8;k++){
      var a=k*Math.PI/4,c=Math.cos(a),s=Math.sin(a);
      g+='<line x1="'+(cx+c*(r+3))+'" y1="'+(cy+s*(r+3))+'" x2="'+(cx+c*(r+3+ray))+'" y2="'+(cy+s*(r+3+ray))+'"/>';
    }
    return g+'</g>';
  }
  function moon(cx,cy,r,id){
    return '<mask id="'+id+'"><rect width="48" height="48" fill="#fff"/><circle cx="'+(cx+r*0.6)+'" cy="'+(cy-r*0.5)+'" r="'+(r*0.82)+'" fill="#000"/></mask>'+
      '<circle class="m" cx="'+cx+'" cy="'+cy+'" r="'+r+'" mask="url(#'+id+')"/>';
  }
  var body='';
  if(kind==='sun')body=sun(24,24,9,5);
  else if(kind==='moon')body=moon(22,26,13,'mm1');
  else if(kind==='partly')body=sun(31,15,7,3)+'<g transform="translate(-2,6)">'+cloud(0)+'</g>';
  else if(kind==='moonpartly')body=moon(30,15,8,'mm2')+'<g transform="translate(-2,6)">'+cloud(0)+'</g>';
  else if(kind==='cloud')body=cloud(2);
  else if(kind==='rain')body=cloud(-6)+'<line class="d" x1="16" y1="32" x2="13" y2="40"/><line class="d" x1="24" y1="34" x2="21" y2="42"/><line class="d" x1="32" y1="32" x2="29" y2="40"/>';
  else if(kind==='storm')body=cloud(-6)+'<polygon class="b" points="27,27 19,38 25,38 22,47 33,34 27,34 30,27"/>';
  else if(kind==='snow')body=cloud(-6)+'<circle class="n" cx="16" cy="34" r="2.6"/><circle class="n" cx="24" cy="38" r="2.6"/><circle class="n" cx="32" cy="34" r="2.6"/><circle class="n" cx="20" cy="43" r="2.2"/><circle class="n" cx="28" cy="43" r="2.2"/>';
  else if(kind==='fog')body=cloud(-6)+'<line class="f" x1="12" y1="34" x2="36" y2="34"/><line class="f" x1="16" y1="40" x2="40" y2="40"/><line class="f" x1="12" y1="46" x2="34" y2="46"/>';
  return '<svg class="wi" width="'+size+'" height="'+size+'" viewBox="0 0 48 48" aria-hidden="true">'+body+'</svg>';
}

/* ---------- data ---------- */
function sampleData(){
  var now=new Date(); now.setMinutes(0,0,0);
  var hours=[];
  for(var i=0;i<25;i++){
    var tt=new Date(now.getTime()+i*36e5);
    var g=function(c,w){return Math.exp(-Math.pow(i-c,2)/(2*w*w));};
    var chance=Math.round(Math.min(96,8+88*g(7,2.2)+55*g(21,1.8)));
    var mm=chance>40?+((chance-40)/56*2.4).toFixed(1):0;
    var temp=+(14+5*Math.sin((tt.getHours()-9)/24*2*Math.PI)-(chance>60?1.5:0)).toFixed(1);
    var wind=+(12+14*g(7,3)+4*Math.sin(i/4)).toFixed(1);
    var feels=+(temp-wind*0.1).toFixed(1);
    var hr=tt.getHours();
    hours.push({t:tt,chance:chance,mm:mm,temp:temp,feels:feels,wind:wind,
      code:chance>=70?63:(chance>=40?3:2),day:hr>=7&&hr<20,hum:Math.round(78-chance*0.15)});
  }
  var chances=[85,40,10,20,65,90,30],codes=[61,3,0,1,80,95,2],hi=[17,18,21,22,18,16,19],lo=[11,10,11,12,12,10,9],days=[];
  for(var k=0;k<7;k++){
    var d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k);
    days.push({t:d0,chance:chances[k],code:codes[k],hi:hi[k],lo:lo[k],
      sunrise:new Date(d0.getFullYear(),d0.getMonth(),d0.getDate(),6,45),
      sunset:new Date(d0.getFullYear(),d0.getMonth(),d0.getDate(),19,50),uv:5});
  }
  return {hours:hours,days:days,current:{code:3,day:hours[0].day}};
}
function sampleNow(){
  var t0=new Date(); t0.setSeconds(0,0); t0.setMinutes(Math.floor(t0.getMinutes()/5)*5);
  var pts=[];
  for(var i=0;i<24;i++){
    var v=2.6*Math.exp(-Math.pow(i-13,2)/(2*3.4*3.4));
    pts.push({t:new Date(t0.getTime()+i*300000),mm:v<0.1?0:+v.toFixed(2)});
  }
  return {step:5,source:'sample',points:pts};
}
function fromApi(f){
  var h=f.hourly,start=0;
  if(f.current_weather&&f.current_weather.time){
    var key=f.current_weather.time.slice(0,13)+':00';
    var idx=h.time.findIndex(function(x){return x>=key;});
    if(idx>=0)start=idx;
  }
  var hours=[];
  for(var i=start;i<start+25&&i<h.time.length;i++){
    hours.push({
      t:new Date(h.time[i]),
      chance:h.precipitation_probability[i]||0,
      mm:h.precipitation[i]||0,
      temp:h.temperature_2m[i],
      feels:h.apparent_temperature[i],
      wind:h.wind_speed_10m[i]||0,
      code:h.weather_code?h.weather_code[i]:null,
      day:h.is_day?h.is_day[i]===1:true,
      hum:h.relative_humidity_2m?h.relative_humidity_2m[i]:null
    });
  }
  var d=f.daily,days=[];
  for(var k=0;k<d.time.length;k++){
    var p=d.time[k].split('-');
    days.push({
      t:new Date(+p[0],+p[1]-1,+p[2]),
      chance:d.precipitation_probability_max[k]||0,
      code:d.weather_code[k],hi:d.temperature_2m_max[k],lo:d.temperature_2m_min[k],
      sunrise:d.sunrise?new Date(d.sunrise[k]):null,
      sunset:d.sunset?new Date(d.sunset[k]):null,
      uv:d.uv_index_max?d.uv_index_max[k]:null
    });
  }
  var cw=f.current_weather||{},code=days[0].code;
  if(typeof cw.weathercode==='number')code=cw.weathercode;
  else if(typeof cw.weather_code==='number')code=cw.weather_code;
  var day=(typeof cw.is_day==='number')?cw.is_day===1:hours[0].day;
  return {hours:hours,days:days,current:{code:code,day:day}};
}

/* 2-hour rain: Buienradar (5 min, Netherlands and nearby) or Open-Meteo (15 min) */
function parseBuienradar(text){
  var parts=text.trim().split(/\s+/).filter(function(x){return x.indexOf('|')>0;});
  var base=new Date(),pts=[],prev=-1,dayAdd=0;
  parts.forEach(function(line){
    var a=line.split('|'),v=parseFloat(a[0].replace(',','.')),tt=a[1].split(':');
    var mins=(+tt[0])*60+(+tt[1]);
    if(prev>=0&&mins<prev)dayAdd++;
    prev=mins;
    var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+dayAdd,+tt[0],+tt[1]);
    pts.push({t:d,mm:(isNaN(v)||v<=0)?0:Math.pow(10,(v-109)/32)});
  });
  if(pts.length<6)throw new Error('short');
  return {step:5,source:'buienradar',points:pts};
}
function openMeteoNow(la,lo){
  var url='https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+
    '&minutely_15=precipitation&current_weather=true&forecast_days=2&timezone=auto';
  return fetch(url).then(function(r){return r.json();}).then(function(j){
    if(!j.minutely_15||!j.minutely_15.time)throw new Error('none');
    var times=j.minutely_15.time,prec=j.minutely_15.precipitation;
    var key=j.current_weather?j.current_weather.time:times[0];
    var idx=times.findIndex(function(x){return x>=key;});
    if(idx<0)idx=0;
    var pts=[];
    for(var k=0;k<9&&idx+k<times.length;k++){
      pts.push({t:new Date(times[idx+k]),mm:(prec[idx+k]||0)*4});
    }
    if(pts.length<3)throw new Error('short');
    return {step:15,source:'openmeteo',points:pts};
  });
}
function loadNowcast(lat,lon){
  var la=+lat,lo=+lon,first;
  if(la>=50&&la<=54&&lo>=1&&lo<=10){
    first=fetch('https://gadgets.buienradar.nl/data/raintext?lat='+la.toFixed(2)+'&lon='+lo.toFixed(2))
      .then(function(r){if(!r.ok)throw new Error('http');return r.text();})
      .then(parseBuienradar);
  }else{
    first=Promise.reject(new Error('outside'));
  }
  return first.catch(function(){return openMeteoNow(la,lo);})
    .then(function(n){state.now=n;},function(){state.now=null;})
    .then(function(){if(state.mode==='now')drawChart();});
}

function hero(){
  var d=state.data,cu=d.current,info=codeInfo(cu.code,cu.day),h0=d.hours[0];
  $('hicon').innerHTML=icon(info.kind,84);

  if(today==='rain')tip=t('tip_rain');

  else if(today==='snow')tip=t('tip_snow');
  else if(today==='sun')tip=t('tip_sun');
  $('tip').textContent=tip;
}
function summary(){
  var hs=state.data.hours,best=0,i;
  for(i=1;i<hs.length;i++){if(hs[i].chance>hs[best].chance)best=i;}
  var wet=hs.map(function(h){return h.chance>=50;});
  var first=wet.indexOf(true);
  var s=$('summary'),sub=$('sub');
  if(first<0){
    s.textContent=t('sum_none');
    sub.textContent=t('sum_high',{p:hs[best].chance,t:fmtH(hs[best].t)});
  }else{
    var last=first;
    while(last+1<wet.length&&wet[last+1])last++;
    var heavy=first;
    for(i=first;i<=last;i++){if(hs[i].mm>hs[heavy].mm)heavy=i;}
    s.textContent=first===0?t('sum_now',{t:fmtH(hs[last].t)}):t('sum_range',{a:fmtH(hs[first].t),b:fmtH(hs[last].t)});
    sub.textContent=hs[heavy].mm>0?t('sum_heavy',{t:fmtH(hs[heavy].t),v:fmtAmt(hs[heavy].mm),u:aU()}):t('sum_light');
  }
  var total=0;
  for(i=0;i<Math.min(24,hs.length);i++)total+=hs[i].mm;
  $('sFeels').textContent=Math.round(tmp(hs[0].feels))+'°';
  $('sWind').textContent=Math.round(spd(hs[0].wind))+' '+sU();
  $('sRain').textContent=fmtAmt(total)+' '+aU();
}
function dryWindow(){
  var hs=state.data.hours.slice(0,24),best=null,run=null,val;
  hs.forEach(function(h,i){
    var dry=h.chance<30&&h.mm<0.1;
    if(dry){
      if(!run)run={s:i,e:i};else run.e=i;
      if(!best||(run.e-run.s)>(best.e-best.s))best={s:run.s,e:run.e};
    }else run=null;
  });
  if(!best||best.e-best.s+1<2)val=t('dry_none');
  else if(best.s===0&&best.e===hs.length-1)val=t('dry_all');
  else{
    var end=new Date(hs[best.e].t.getTime()+36e5);
    val=fmtH(hs[best.s].t)+' – '+fmtH(end);
  }
  $('dry').innerHTML='<span>'+esc(t('dry_title'))+'</span><b>'+esc(val)+'</b>';
}
function strip(){
  var hs=state.data.hours.slice(0,24),h='';
  hs.forEach(function(x,i){
    var info=codeInfo(x.code==null?state.data.current.code:x.code,x.day);
    h+='<div class="hr"><span class="h">'+esc(i===0?t('r_now'):fmtH(x.t))+'</span>'+icon(info.kind,30)+

  });

}

/* ---------- Charts tab ---------- */
function smooth(pts,yMin,yMax){
  var d='M'+pts[0][0]+','+pts[0][1];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=clamp(p1[1]+(p2[1]-p0[1])/6,yMin,yMax);
    var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=clamp(p2[1]-(p3[1]-p1[1])/6,yMin,yMax);
    d+='C'+c1x+','+c1y+' '+c2x+','+c2y+' '+p2[0]+','+p2[1];
  }
  return d;
}
function cat(mm){
  if(mm<0.1)return t('c_dry');
  if(mm<0.5)return t('c_light');
  if(mm<2.5)return t('c_moderate');
  if(mm<7.5)return t('c_heavy');
  return t('c_vheavy');
}
function nowHeadline(N){
  var P=N.points,step=N.step;
  var wet=function(x){return x.mm>=0.1;};
  var first=-1,i;
  for(i=0;i<P.length;i++){if(wet(P[i])){first=i;break;}}
  if(first<0)return {big:t('n_dry'),small:t('n_dryuntil',{t:fmtT(P[P.length-1].t)})};
  if(first===0){
    var end=-1;
    for(i=1;i<P.length;i++){if(!wet(P[i])){end=i;break;}}
    if(end<0)return {big:t('n_rainingnow'),small:t('n_continues')};
    return {big:t('n_rainingnow'),small:t('n_stops',{d:dur(end*step)})};
  }
  return {big:t('n_starts',{d:dur(first*step)}),small:t('n_around',{t:fmtT(P[first].t),c:cat(P[first].mm)})};
}
function series(){
  var hs=state.data.hours,m=state.mode;
  if(m==='rain'){
    return {vals:hs.map(function(h){return h.chance;}),lo:0,hi:100,ticks:[0,50,100],suffix:'%',cls:'rain',color:'rain'};
  }
  if(m==='wind'){
    var w=hs.map(function(h){return spd(h.wind);});
    var hi=Math.max(10,Math.ceil(Math.max.apply(null,w)/10)*10);
    return {vals:w,lo:0,hi:hi,ticks:[0,hi/2,hi],suffix:'',cls:'wind',color:'wind'};
  }
  var a=hs.map(function(h){return tmp(h.temp);}),b=hs.map(function(h){return tmp(h.feels);});
  var all=a.concat(b);
  var lo=Math.floor(Math.min.apply(null,all)-1),hi2=Math.ceil(Math.max.apply(null,all)+1);
  return {vals:a,vals2:b,lo:lo,hi:hi2,ticks:[lo,Math.round((lo+hi2)/2),hi2],suffix:'°',cls:'temp',color:'warm'};
}
function drawSeries(){
  var hs=state.data.hours,n=hs.length-1,S=series(),rain=state.mode==='rain';
  var X=function(i){return L+PW*i/n;},Y=function(v){return T+PH*(1-(v-S.lo)/(S.hi-S.lo));};
  var pts=S.vals.map(function(v,i){return [X(i),Y(v)];});
  var line=smooth(pts,T,T+PH);
  var area=line+'L'+X(n)+','+(T+PH)+'L'+X(0)+','+(T+PH)+'Z';
  var svg='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" style="stop-color:var(--'+S.color+');stop-opacity:.35"/>'+

function drawNow(){
  var N=state.now;
  if(!N){
    $('chart').innerHTML='<text class="axis mid" x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle">'+esc(t('n_none'))+'</text>';
    setReadout(esc(t('n_na')),esc(t('n_couldnot')));
    $('legend').textContent='';
    ch=null;
    return;
  }
  var P=N.points,n=P.length;
  var maxmm=Math.max.apply(null,P.map(function(p){return p.mm;}));
  var hi=maxmm<=1?1:maxmm<=2?2:maxmm<=5?5:Math.ceil(maxmm/5)*5;
  var slot=PW/n,X=function(i){return L+slot*(i+0.5);},Y=function(v){return T+PH*(1-v/hi);};
  var svg='';
  [0,hi/2,hi].forEach(function(tk){
    svg+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(tk)+'" y2="'+Y(tk)+'"/>'+
      '<text class="axis" x="'+(L-8)+'" y="'+(Y(tk)+4)+'" text-anchor="end">'+fmtAmt(tk)+'</text>';
  });
  P.forEach(function(p,i){
    var bh=PH*p.mm/hi;
    if(p.mm>0&&bh<3)bh=3;
    if(bh<=0)return;
    svg+='<rect class="nbar" data-i="'+i+'" x="'+(X(i)-slot*0.36)+'" y="'+(T+PH-bh)+'" width="'+(slot*0.72)+'" height="'+bh+'" rx="'+Math.min(4,slot*0.3)+'"/>';
  });
  P.forEach(function(p,i){
    var off=Math.round((p.t-P[0].t)/60000);
    if(off%30===0){
      svg+='<text class="axis" x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+(off===0?esc(t('r_now')):fmtT(p.t))+'</text>';
    }
  });
  if(maxmm<0.1)svg+='<text class="axis mid" x="'+(W/2)+'" y="'+(T+PH/2)+'" text-anchor="middle">'+esc(t('n_norain'))+'</text>';
  svg+='<line class="guide" id="guide" y1="'+T+'" y2="'+(T+PH)+'" style="display:none"/>';
  $('chart').innerHTML=svg;
  ch={kind:'now',X:X,slot:slot,max:n-1};
  var src;
  if(N.source==='buienradar')src=t('lg_radar',{link:'<a href="https://www.buienradar.nl" target="_blank" rel="noopener">Buienradar</a>'});
  else if(N.source==='sample')src=t('lg_sample');
  else src=t('lg_om');
  $('legend').innerHTML=src+' '+esc(t('lg_bars',{u:aU()}));
  setActive(null);
}

function setReadout(big,small){
  $('readout').innerHTML='<div class="big">'+big+'</div><div class="small">'+small+'</div>';
}
function setActive(i){
  if(state.mode==='now'){
    var N=state.now,g=$('guide');
    if(!N||!g)return;
    var bars=document.querySelectorAll('.nbar'),k;
    for(k=0;k<bars.length;k++)bars[k].classList.remove('on');
    if(i===null){
      var hd=nowHeadline(N);
      g.style.display='none';
      setReadout(esc(hd.big),esc(hd.small));
    }else{
      var p=N.points[i],x=ch.X(i);
      g.style.display='';g.setAttribute('x1',x);g.setAttribute('x2',x);
      setReadout(esc(cat(p.mm)),esc((i===0?t('r_now'):fmtT(p.t))+' · '+t('r_perhour',{v:fmtAmt(p.mm),u:aU()})));
      for(k=0;k<bars.length;k++){
        if(+bars[k].getAttribute('data-i')===i)bars[k].classList.add('on');
      }
    }
    return;
  }
  var h=state.data.hours[i],m=state.mode;
  var x2=ch.X(i),y=ch.Y(ch.vals[i]);
  var g2=$('guide'),d=$('dot');
  g2.setAttribute('x1',x2);g2.setAttribute('x2',x2);
  d.setAttribute('cx',x2);d.setAttribute('cy',y);
  var when=i===0?t('r_now'):fmtH(h.t),big,small;
  if(m==='rain'){
    big=t('r_chance',{p:h.chance});
    small=when+(h.mm>0?' · '+t('r_perhour',{v:fmtAmt(h.mm),u:aU()}):'');
  }else if(m==='wind'){
    big=t('r_wind',{v:Math.round(spd(h.wind)),u:sU()});
    small=when;
  }else{
    big=Math.round(tmp(h.temp))+tU();
    small=when+' · '+t('r_feels',{v:Math.round(tmp(h.feels))+tU()});
  }
  setReadout(esc(big),esc(small));
}

function getPlaces(){try{return JSON.parse(lsGet('rl_places')||'[]')||[];}catch(e){return [];}}
function setPlaces(a){lsSet('rl_places',JSON.stringify(a));}
function pkey(lat,lon){return (+lat).toFixed(2)+','+(+lon).toFixed(2);}
function isSaved(){
  if(!state.cur)return false;
  var k=pkey(state.cur.lat,state.cur.lon);
  return getPlaces().some(function(p){return pkey(p.lat,p.lon)===k;});
}
function savePlace(p){
  var arr=getPlaces(),k=pkey(p.lat,p.lon);
  if(!arr.some(function(x){return pkey(x.lat,x.lon)===k;})){
    arr.push({name:p.name,lat:p.lat,lon:p.lon});
    setPlaces(arr);
  }
}
function toggleSave(){
  if(!state.cur||!state.live)return;
  var k=pkey(state.cur.lat,state.cur.lon),arr=getPlaces();
  if(isSaved())arr=arr.filter(function(p){return pkey(p.lat,p.lon)!==k;});
  else arr.push({name:state.cur.name,lat:state.cur.lat,lon:state.cur.lon});
  setPlaces(arr);
  renderPlaces();updateStar();
}
function updateStar(){
  var s=$('star'),saved=isSaved();

  s.disabled=!state.live;

function dispName(n){return n===HERE?t('here'):n;}

function doSearch(){
  var q=$('city').value.trim();
  if(!q)return;
  status(t('st_lookup',{q:q}));

function pickResult(i){

/* ---------- network: forecast + names ---------- */
function status(s){$('status').textContent=s;}
function nameFor(lat,lon){
  return fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage='+cfg.lang)
    .then(function(r){return r.json();})
    .then(function(j){
      var c=j.city||j.locality||j.principalSubdivision;
      if(!c)return HERE;
      return c+(j.countryName?', '+j.countryName:'');
    })
    .catch(function(){return HERE;});
}
function loadForecast(lat,lon,name){
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
    '&current_weather=true&hourly=precipitation_probability,precipitation,temperature_2m,apparent_temperature,wind_speed_10m,weather_code,is_day,relative_humidity_2m'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7';
  var ic=$('refreshIcon');
  ic.classList.add('spin');
  return fetch(url).then(function(r){return r.json();}).then(function(f){
    if(!f.hourly)throw new Error('no data');
    state.data=fromApi(f);state.place=name;state.live=true;state.now=null;loadedAt=Date.now();
    state.cur={lat:lat,lon:lon,name:name};
    lsSet('rl_place',JSON.stringify(state.cur));
    renderAll();
    status(t('st_updated',{t:fmtT(new Date())}));
    return loadNowcast(lat,lon).then(evaluateAlerts);
  }).then(function(x){ic.classList.remove('spin');return x;},function(e){ic.classList.remove('spin');throw e;});
}
function failed(){
  if(!state.live){
    state.place=null;state.data=sampleData();state.now=sampleNow();
    renderAll();
    status(t('st_fail'));
  }else{
    status(t('st_failrefresh'));
  }
}
function readSaved(){
  try{return JSON.parse(lsGet('rl_place')||'null');}catch(e){return null;}
}
function refreshSaved(silent){
  var s=readSaved();
  if(!s)return false;
  if(!silent)status(t('st_loading',{name:dispName(s.name)}));
  var p=s.name===HERE||s.name==='Your location'?nameFor(s.lat,s.lon):Promise.resolve(s.name);
  p.then(function(name){return loadForecast(s.lat,s.lon,name);}).catch(failed);
  return true;
}
function locate(){
  if(!navigator.geolocation){status(t('st_nogeo'));return;}
  status(t('st_finding'));
  navigator.geolocation.getCurrentPosition(function(p){
    var lat=p.coords.latitude.toFixed(3),lon=p.coords.longitude.toFixed(3);
    status(t('st_loadfc'));
    nameFor(lat,lon).then(function(name){return loadForecast(lat,lon,name);}).then(function(){goTab(0,true);}).catch(failed);
  },function(){
    status(t('st_locoff'));
  },{timeout:10000});
}

function onSettingsClick(e){
  var el=e.target.closest?e.target.closest('[data-set],[data-sw],[data-act]'):null;
  if(!el)return;
  if(el.hasAttribute('data-set')){setKey(el.getAttribute('data-set'),el.getAttribute('data-val'));return;}
  if(el.hasAttribute('data-sw')){
    var k=el.getAttribute('data-sw');
    if(k==='a_phone'){togglePhone();return;}
    setKey(k,!cfg[k]);return;
  }
  var act=el.getAttribute('data-act');
  if(act==='test'){fireAlert({title:t('al_test_t'),body:t('al_test_b')},true);}
  else if(act==='copytopic'){copyText(getTopic());}
  else if(act==='copysetup'){
    var y=buildWorkflow();
    if(!y){status(t('st_sample'));return;}
    copyText(y);
  }
  else if(act==='reset'){
    var keepLang=cfg.lang;
    cfg={};for(var x in DEF)cfg[x]=DEF[x];cfg.lang=keepLang;
    saveCfg();applyCfg();renderAll();
  }
}
function togglePhone(){
  if(cfg.a_phone){cfg.a_phone=false;saveCfg();renderSettings();return;}
  if(typeof Notification==='undefined'){renderSettings();return;}
  var done=function(p){cfg.a_phone=(p==='granted');saveCfg();renderSettings();};
  try{
    var r=Notification.requestPermission(done);
    if(r&&r.then)r.then(done);
  }catch(e){renderSettings();}
}

/* ---------- alerts ---------- */
function readAlertState(){try{return JSON.parse(lsGet('rl_alert')||'{}')||{};}catch(e){return {};}}
function showBanner(a){
  $('bannerText').innerHTML='<b>'+esc(a.title)+'</b> '+esc(a.body);
  $('banner').hidden=false;
}
function notify(a,force){
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  if(!cfg.a_phone&&!force)return;
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification(a.title,{body:a.body,icon:'icon-192.png',tag:'rainline'});
      });
    }else{new Notification(a.title,{body:a.body});}
  }catch(e){}
}
function fireAlert(a,force){
  showBanner(a);
  if(force||(typeof document!=='undefined'&&document.hidden))notify(a,force);
}
function evaluateAlerts(){
  if(!cfg.a_on||!state.live||!state.data)return;
  var as=readAlertState(),now=Date.now(),list=[],P,step,i;
  if(state.now){P=state.now.points;step=state.now.step;}
  else{P=state.data.hours.map(function(h){return {t:h.t,mm:h.mm};});step=60;}
  var wet=function(x){return x.mm>=0.1;},wetNow=wet(P[0]),first=-1,stop=-1;
  for(i=0;i<P.length;i++){if(wet(P[i])){first=i;break;}}
  if(wetNow){for(i=1;i<P.length;i++){if(!wet(P[i])){stop=i;break;}}}
  var lead=+cfg.a_lead;
  if(cfg.a_start&&!wetNow&&first>0&&first*step<=lead&&now-(as.sStart||0)>60*60000){
    list.push({title:t('al_start_t'),body:t('al_start_b',{d:dur(first*step)})});as.sStart=now;
  }
  if(cfg.a_stop&&wetNow&&stop>0&&stop*step<=lead&&now-(as.sStop||0)>30*60000){
    list.push({title:t('al_stop_t'),body:t('al_stop_b',{d:dur(stop*step)})});as.sStop=now;
  }
  if(cfg.a_dry&&as.wet===true&&!wetNow&&as.at&&now-as.at<3*3600000){
    list.push({title:t('al_dry_t'),body:t('al_dry_b')});
  }
  var today=new Date().toDateString();
  if(cfg.a_storm&&codeInfo(state.data.days[0].code,true).kind==='storm'&&as.sStorm!==today){
    list.push({title:t('al_storm_t'),body:t('al_storm_b')});as.sStorm=today;
  }
  as.wet=wetNow;as.at=now;
  lsSet('rl_alert',JSON.stringify(as));
  list.forEach(function(a){fireAlert(a,false);});
}

/* ---------- real pings: ntfy topic + GitHub Actions setup ---------- */
var WFSCRIPT=String.raw`// Rainline alerts. Runs on GitHub Actions and sends pings through ntfy.sh
const cfg = JSON.parse(process.env.CFG);
const tx = cfg.tx;
const now = Date.now();
const TOPIC_URL = 'https://ntfy.sh/' + cfg.topic;

function fill(s, v) { for (const k in v) s = s.split('{' + k + '}').join(v[k]); return s; }
function dur(m) {
  return m < 60 ? m + ' ' + tx.d_min : Math.floor(m / 60) + ' ' + tx.d_h + (m % 60 ? ' ' + (m % 60) + ' ' + tx.d_min : '');
}
async function getJSON(u) {
  const r = await fetch(u);
  if (!r.ok) throw new Error(u + ' -> ' + r.status);
  return r.json();
}

// Rain per hour for the next ~2 hours, plus whether it rained in the last hour
async function nowcast() {
  const la = cfg.lat, lo = cfg.lon;
  let step = 15, mm = [], wetRecently = false;
  try {
    const j = await getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + la + '&longitude=' + lo +
      '&minutely_15=precipitation&current_weather=true&forecast_days=2&timezone=auto');
    const times = j.minutely_15.time, prec = j.minutely_15.precipitation;
    let idx = times.findIndex(x => x >= j.current_weather.time);
    if (idx < 0) idx = 0;
    for (let k = 0; k < 9 && idx + k < times.length; k++) mm.push((prec[idx + k] || 0) * 4);
    for (let k = 1; k <= 4 && idx - k >= 0; k++) if ((prec[idx - k] || 0) * 4 >= 0.1) wetRecently = true;
  } catch (e) { console.log('Open-Meteo failed:', e.message); }
  if (la >= 50 && la <= 54 && lo >= 1 && lo <= 10) {
    try {
      const r = await fetch('https://gadgets.buienradar.nl/data/raintext?lat=' + la.toFixed(2) + '&lon=' + lo.toFixed(2));
      if (r.ok) {
        const rows = (await r.text()).trim().split(/\s+/).filter(x => x.indexOf('|') > 0);
        if (rows.length >= 6) {
          step = 5;
          mm = rows.map(x => {
            const v = parseFloat(x.split('|')[0].replace(',', '.'));
            return (!isFinite(v) || v <= 0) ? 0 : Math.pow(10, (v - 109) / 32);
          });
        }
      }
    } catch (e) { console.log('Buienradar failed:', e.message); }
  }
  if (!mm.length) throw new Error('No rain data available');
  return { step: step, mm: mm, wetRecently: wetRecently };
}

// ntfy keeps messages for 12 hours, so the topic doubles as our memory (no repeats)
async function history() {
  try {
    const r = await fetch(TOPIC_URL + '/json?poll=1&since=12h');
    const rows = (await r.text()).trim().split('\n').filter(Boolean);
    const out = [];
    for (const l of rows) {
      try { const m = JSON.parse(l); if (m.event === 'message') out.push(m); } catch (e) { /* skip */ }
    }
    return out;
  } catch (e) { return []; }
}
function last(hist, tag) {
  let b = 0;
  for (const m of hist) if ((m.tags || []).indexOf(tag) >= 0 && m.time > b) b = m.time;
  return b * 1000;
}
function quietNow() {
  if (!cfg.quiet) return false;
  const a = cfg.quiet[0], b = cfg.quiet[1];
  if (a === b) return false;
  const h = parseInt(new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hourCycle: 'h23', timeZone: cfg.tz || 'UTC' }).format(new Date()), 10);
  return a < b ? (h >= a && h < b) : (h >= a || h < b);
}
async function send(tag, emoji, title, message, priority) {
  const r = await fetch('https://ntfy.sh/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic: cfg.topic, title: title, message: message, tags: [tag, emoji], priority: priority, click: cfg.url })
  });
  if (!r.ok) throw new Error('ntfy -> ' + r.status);
  console.log('Sent', tag);
}

async function main() {
  if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
    await send('rl-test', 'white_check_mark', tx.al_test_t, tx.al_test_b, 3);
    return;
  }
  const hist = await history();
  const nc = await nowcast(), mm = nc.mm, step = nc.step;
  const wet = x => x >= 0.1, wetNow = wet(mm[0]);
  let first = -1, stop = -1;
  for (let i = 0; i < mm.length; i++) if (wet(mm[i])) { first = i; break; }
  if (wetNow) for (let i = 1; i < mm.length; i++) if (!wet(mm[i])) { stop = i; break; }
  console.log('wetNow:', wetNow, '| rain starts in (min):', first < 0 ? 'none' : first * step, '| stops in (min):', stop < 0 ? 'none' : stop * step);

  const todo = [];
  if (cfg.start && !wetNow && first > 0 && first * step <= cfg.lead && now - last(hist, 'rl-start') > 60 * 60000) {
    todo.push(['rl-start', 'cloud_with_rain', tx.al_start_t, fill(tx.al_start_b, { d: dur(first * step) }), 4]);
  }
  if (cfg.stop && wetNow && stop > 0 && stop * step <= cfg.lead && now - last(hist, 'rl-stop') > 30 * 60000) {
    todo.push(['rl-stop', 'partly_sunny', tx.al_stop_t, fill(tx.al_stop_b, { d: dur(stop * step) }), 3]);
  }
  if (cfg.dry && !wetNow && nc.wetRecently && now - last(hist, 'rl-dry') > 60 * 60000) {
    todo.push(['rl-dry', 'sunny', tx.al_dry_t, tx.al_dry_b, 3]);
  }
  if (cfg.storm && now - last(hist, 'rl-storm') > 12 * 3600000) {
    try {
      const d = await getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + cfg.lat + '&longitude=' + cfg.lon +
        '&daily=weather_code&timezone=auto&forecast_days=1');
      if (d.daily && d.daily.weather_code[0] >= 95) {
        todo.push(['rl-storm', 'thunder_cloud_and_rain', tx.al_storm_t, tx.al_storm_b, 4]);
      }
    } catch (e) { console.log('Storm check failed:', e.message); }
  }
  if (quietNow()) { console.log('Quiet hours: nothing sent'); return; }
  for (const a of todo) await send(a[0], a[1], a[2], a[3], a[4]);
  if (!todo.length) console.log('Nothing to send');
}
main().catch(e => { console.error(e); process.exit(1); });
`;
function getTopic(){
  var tp=lsGet('rl_topic');
  if(!tp){
    var a=new Uint8Array(10),i;
    try{crypto.getRandomValues(a);}catch(e){for(i=0;i<10;i++)a[i]=Math.floor(Math.random()*256);}
    tp='rainline-'+Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
    lsSet('rl_topic',tp);
  }
  return tp;
}
function tzName(){
  try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';}catch(e){return 'UTC';}
}
function buildWorkflow(){
  var c=state.cur;
  if(!c||!state.live)return null;
  var tx={};
  ['al_start_t','al_start_b','al_stop_t','al_stop_b','al_dry_t','al_dry_b','al_storm_t','al_storm_b','al_test_t','al_test_b','d_min','d_h'].forEach(function(k){tx[k]=t(k);});
  var conf={topic:getTopic(),lat:+c.lat,lon:+c.lon,lead:+cfg.a_lead,start:!!cfg.a_start,stop:!!cfg.a_stop,dry:!!cfg.a_dry,storm:!!cfg.a_storm,
    quiet:cfg.q_on?[+cfg.q_from,+cfg.q_to]:null,tz:tzName(),url:location.origin+location.pathname,tx:tx};
  function ind(txt,n){var p=new Array(n+1).join(' ');return txt.split('\n').map(function(l){return l.length?p+l:l;}).join('\n');}
  return ['name: Rainline alerts','on:','  schedule:',"    - cron: '3-59/5 * * * *'",'  workflow_dispatch:','permissions: {}','concurrency:',
    '  group: rainline-alerts','  cancel-in-progress: false','jobs:','  check:','    runs-on: ubuntu-latest','    timeout-minutes: 3','    env:','      CFG: |',
    ind(JSON.stringify(conf),8),'    steps:','      - name: Check the weather and send pings','        run: |',"          node - <<'JS'",
    ind(WFSCRIPT.replace(/\s+$/,''),10),'          JS',''].join('\n');
}
function copyText(txt){
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);
      var ok=document.execCommand('copy');
      document.body.removeChild(ta);
      status(ok?t('copied'):t('copy_fail'));
    }catch(e){status(t('copy_fail'));}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){status(t('copied'));},fallback);
  }else fallback();
}

/* ---------- swipeable tabs ---------- */
var pager=$('pager'),tabsEl=$('tabs'),ind=$('ind'),tabEls=[];
function collectTabs(){tabEls=Array.prototype.slice.call(document.querySelectorAll('.tab'));}
function paneW(){return pager.clientWidth||1;}
function syncTabs(){
  var i;
  for(i=0;i<tabEls.length;i++){
    tabEls[i].setAttribute('aria-selected',i===tabIdx?'true':'false');
  }
  var tb=tabEls[tabIdx];
  if(tb&&tabsEl){tabsEl.scrollLeft=tb.offsetLeft-(tabsEl.clientWidth-tb.offsetWidth)/2;}
}
function updInd(){
  if(!tabEls.length)return;
  var p=clamp(pager.scrollLeft/paneW(),0,tabEls.length-1);
  var i=Math.floor(p),f=p-i,a=tabEls[i],b=tabEls[Math.min(i+1,tabEls.length-1)];
  var left=a.offsetLeft+(b.offsetLeft-a.offsetLeft)*f;
  var width=a.offsetWidth+(b.offsetWidth-a.offsetWidth)*f;
  ind.style.left=(left+12)+'px';
  ind.style.width=Math.max(0,width-24)+'px';
  var idx=Math.round(p);
  if(idx!==tabIdx){tabIdx=idx;syncTabs();}
}
function goTab(i,smooth){
  var reduce=typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var x=i*paneW();
  if(typeof pager.scrollTo==='function')pager.scrollTo({left:x,top:0,behavior:(smooth&&!reduce)?'smooth':'auto'});
  else pager.scrollLeft=x;
  tabIdx=i;syncTabs();updInd();
}

/* ---------- events ---------- */
function maybeRefresh(){
  if(!document.hidden&&state.live&&Date.now()-loadedAt>(+cfg.refresh||10)*60*1000)refreshSaved(true);
}
function bind(){
  var svgEl=$('chart'),ticking=false;
  svgEl.addEventListener('pointermove',pointer);
  svgEl.addEventListener('pointerdown',pointer);
  svgEl.addEventListener('pointerleave',function(e){
    if(e.pointerType==='mouse'&&state.mode==='now'&&ch)setActive(null);
  });
  function pointer(e){
    if(!ch)return;
    var r=svgEl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i;
    if(ch.kind==='now')i=clamp(Math.floor((x-L)/ch.slot),0,ch.max);
    else i=clamp(Math.round((x-L)/PW*ch.max),0,ch.max);
    setActive(i);
  }
  pager.addEventListener('scroll',function(){
    if(ticking)return;
    ticking=true;
    (window.requestAnimationFrame||function(f){f();})(function(){ticking=false;updInd();});
  });
  window.addEventListener('resize',function(){pager.scrollLeft=tabIdx*paneW();updInd();});
  tabEls.forEach(function(b,i){b.addEventListener('click',function(){goTab(i,true);});});
  var ms=document.querySelectorAll('#modes button');
  for(var i=0;i<ms.length;i++){(function(b){
    b.addEventListener('click',function(){setMode(b.getAttribute('data-mode'));});
  })(ms[i]);}
  $('go').addEventListener('click',doSearch);
  $('city').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
  $('locate').addEventListener('click',locate);
  $('star').addEventListener('click',toggleSave);
  $('refresh').addEventListener('click',function(){
    if(!refreshSaved(false)){status(t('st_sample'));}
  });
  $('results').addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-res]'):null;
    if(el)pickResult(+el.getAttribute('data-res'));
  });
  $('plist').addEventListener('click',function(e){
    var go=e.target.closest?e.target.closest('[data-go]'):null,del=e.target.closest?e.target.closest('[data-del]'):null;
    var arr=getPlaces();
    if(go){
      var p=arr[+go.getAttribute('data-go')];
      if(p)loadPlace(p).then(function(){goTab(0,true);}).catch(function(){});
    }else if(del){
      arr.splice(+del.getAttribute('data-del'),1);
      setPlaces(arr);renderPlaces();updateStar();
    }
  });
  var st=$('settings');
  st.addEventListener('click',onSettingsClick);
  st.addEventListener('change',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-sel');
    if(k)setKey(k,e.target.value);
  });
  $('bannerClose').addEventListener('click',function(){$('banner').hidden=true;});
  $('bannerText').addEventListener('click',function(){setMode('now');goTab(1,true);$('banner').hidden=true;});
  document.addEventListener('visibilitychange',maybeRefresh);
  setInterval(maybeRefresh,60*1000);
}

/* ---------- start ---------- */
loadCfg();
applyCfg();
collectTabs();
state.data=sampleData();
state.now=sampleNow();
var saved=readSaved();
if(saved){state.place=saved.name;state.cur=saved;}
renderAll();
bind();
(function(){
  var idx=saved?Math.max(0,TABKEYS.indexOf(cfg.start)):3;
  if(idx<0||idx>3)idx=0;
  goTab(idx,false);
})();
if(saved){refreshSaved(false);}
else{status(t('st_sample'));}

if(typeof window!=='undefined'&&window.__RL_TEST){
  window.__RL_TEST={state:state,get cfg(){return cfg;},t:t,evaluateAlerts:evaluateAlerts,setKey:setKey,renderAll:renderAll,goTab:goTab,parseBuienradar:parseBuienradar,I18N:I18N,setActive:setActive,setMode:setMode,fireAlert:fireAlert,codeInfo:codeInfo,icon:icon,buildWorkflow:buildWorkflow,getTopic:getTopic};
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

})();
